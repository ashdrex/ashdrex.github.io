      <circle cx="45" cy="560" r="130"/><circle cx="290" cy="535" r="160"/><circle cx="560" cy="560" r="165"/><circle cx="785" cy="550" r="125"/>
      <circle cx="145" cy="810" r="170"/><circle cx="425" cy="810" r="175"/><circle cx="700" cy="815" r="180"/>
      <circle cx="35" cy="1000" r="140"/><circle cx="320" cy="1010" r="160"/><circle cx="610" cy="1000" r="175"/>
    </g>
    <g fill="url(#leaf)">
