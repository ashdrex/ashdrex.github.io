<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1025" role="img" aria-labelledby="title desc">
  <title id="title">Autumn forest canopy</title>
  <desc id="desc">Aerial illustration of dense autumn forest in olive, evergreen, amber, orange and burgundy.</desc>
  <defs>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#d7d9a1"/><stop offset="1" stop-color="#263b2b"/></linearGradient>
    <radialGradient id="leaf"><stop stop-color="#e8b56b"/><stop offset=".72" stop-color="#a65d3f"/><stop offset="1" stop-color="#493c31"/></radialGradient>
    <radialGradient id="evergreen"><stop stop-color="#85905b"/><stop offset=".76" stop-color="#42573d"/><stop offset="1" stop-color="#263b2b"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="820" height="1025" fill="url(#ground)"/>
  <g opacity=".55" filter="url(#soft)">
